<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Aaryan Chaturvedi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="components/nav.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-page="contact">

  <section class="on-red page-section">
    <div class="section-inner wrap">
      <div class="eyebrow" style="color:var(--cream);">06 — GET IN TOUCH</div>
      <div class="contact-row">
        <a href="tel:+33769939039">+33 07 69 93 90 39</a>
        <a href="mailto:aaryan.chaturvedi@edhec.com">aaryan.chaturvedi@edhec.com</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn ↗</a>
      </div>
      <h2 class="sec-title">Contact</h2>
      <p class="contact-tag">LET'S BUILD SOMETHING GREAT TOGETHER.</p>

      <form id="contactForm" class="contact-form">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <textarea name="message" placeholder="Your message" required></textarea>
        <button type="submit" class="btn btn-solid">Send Message</button>
        <p id="formStatus"></p>
      </form>
    </div>
  </section>

</body>
</html>
